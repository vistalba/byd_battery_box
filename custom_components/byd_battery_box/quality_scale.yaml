# Home Assistant Integration Quality Scale – status of this integration
# https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register service actions.
  appropriate-polling: done
  brands:
    status: done
    comment: custom_integrations/byd_battery_box in home-assistant/brands.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register service actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup:
    status: done
    comment: Entities are CoordinatorEntities, no own subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: Button presses raise HomeAssistantError when the battery is not reachable.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The BYD BMU Modbus interface does not use authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The BMU does not announce itself (no mDNS/SSDP/DHCP signature known).
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: Towers added later are detected (static data re-read with the log interval) and their entities are added.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Issue raised when the same battery is configured twice.
  stale-devices:
    status: done
    comment: Devices of towers that no longer exist can be removed by the user.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration does not use HTTP.
  strict-typing:
    status: done
    comment: mypy --strict (blocking in CI).
